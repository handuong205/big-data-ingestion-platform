
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    build: ./minio
    pull_policy: build
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bigdata
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    image: apache/spark:3.5.6
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/event-logs:/opt/spark/event-logs
    networks:
      - bigdata

  spark-worker-1:
    image: apache/spark:3.5.6
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES}
      --memory ${SPARK_WORKER_MEMORY}
      --webui-port 8081
    restart: unless-stopped
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/event-logs:/opt/spark/event-logs
    networks:
      - bigdata

  
  spark-worker-2:
    image: apache/spark:3.5.6
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES}
      --memory ${SPARK_WORKER_MEMORY}
      --webui-port 8082
    restart: unless-stopped
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/event-logs:/opt/spark/event-logs
    networks:
      - bigdata

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - bigdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bigdata

volumes:
  minio_data:
  postgres_data:

networks:
  bigdata:
    driver: bridge
